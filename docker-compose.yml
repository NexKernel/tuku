# PREU Mentor IA — orquestación completa (desarrollo local)
# Nombres con prefijo "socratico-" para no colisionar con otros proyectos.
services:
  socratico-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-preu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-preu_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-preu_mentor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-preu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  socratico-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  socratico-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  socratico-backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      socratico-db:
        condition: service_healthy
      socratico-redis:
        condition: service_started
    environment:
      POSTGRES_HOST: socratico-db
      POSTGRES_USER: ${POSTGRES_USER:-preu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-preu_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-preu_mentor}
      REDIS_URL: redis://socratico-redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost}
      AI_PROVIDER: ${AI_PROVIDER:-echo}
      AI_MODEL: ${AI_MODEL:-claude-opus-4-8}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "8000:8000"

  socratico-frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    depends_on:
      - socratico-backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
