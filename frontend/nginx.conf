server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/manifest+json;
    gzip_min_length 1024;
    # También comprime las respuestas de la API (historial de conversaciones).
    gzip_proxied any;
    gzip_vary on;

    client_max_body_size 1m;

    # Resolver DNS de Docker: permite arrancar aunque el backend no esté listo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Proxy al backend (same-origin, sin CORS) ──────────────────
    # El nombre "tuku-backend" lo resuelve la red del stack (compose/Dokploy).
    location /api/ {
        set $backend http://tuku-backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets (futuro: streaming del tutor)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        # Un turno puede esperar cola de IA (30 s) + la IA con reintentos.
        proxy_read_timeout 150s;
    }

    location = /health {
        set $backend http://tuku-backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # Documentación de la API (Swagger / ReDoc) bajo el mismo dominio
    location ~ ^/(docs|redoc)$ {
        set $backend http://tuku-backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # Cache de assets con hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html sin caché: tras un deploy todos cargan los assets nuevos al instante.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
